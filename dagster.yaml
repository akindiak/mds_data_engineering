storage:
  postgres:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOSTNAME
      db_name:
        env: POSTGRES_DB
      port:
        env: POSTGRES_PORT

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 50
    tag_concurrency_limits:
      - key: "run_coordinator_tag"
        value: "data_qc"
        limit: 2
      - key: "connection"
        value:
          applyLimitPerUniqueValue: true
        limit: 1
      - key: "lms_processing"
        value:
          applyLimitPerUniqueValue: true
        limit: 2
      - key: "scenario"
        limit: 1

retention:
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: 30
run_monitoring:
  enabled: true
  cancel_timeout_seconds: 120
telemetry:
  enabled: false
